<svg viewBox="0 0 850 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1B2D"/>
      <stop offset="100%" stop-color="#18293F"/>
    </linearGradient>
  </defs>
  <rect width="850" height="1200" fill="url(#pbg)"/>

  <!-- Header -->
  <text x="425" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#E8EEF5">Artificial Intelligence</text>
  <text x="425" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#2DD4BF">for Smart Education</text>
  <rect x="325" y="165" width="200" height="4" fill="#FBBF24"/>

  <!-- Stat row -->
  <g font-family="Arial, sans-serif">
    <text x="145" y="240" text-anchor="middle" font-size="46" font-weight="bold" fill="#FBBF24">86%</text>
    <text x="145" y="268" text-anchor="middle" font-size="15" fill="#B9C6D6">students using AI to study</text>

    <text x="425" y="240" text-anchor="middle" font-size="46" font-weight="bold" fill="#2DD4BF">10%+</text>
    <text x="425" y="268" text-anchor="middle" font-size="15" fill="#B9C6D6">avg. exam score increase</text>

    <text x="705" y="240" text-anchor="middle" font-size="46" font-weight="bold" fill="#FBBF24">$136B</text>
    <text x="705" y="268" text-anchor="middle" font-size="15" fill="#B9C6D6">market size by 2035</text>
  </g>
  <line x1="285" y1="200" x2="285" y2="270" stroke="#33455e" stroke-width="1.5"/>
  <line x1="565" y1="200" x2="565" y2="270" stroke="#33455e" stroke-width="1.5"/>

  <!-- Benefits card -->
  <rect x="50" y="320" width="750" height="230" rx="14" fill="#0F1C30" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="80" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2DD4BF">Benefits</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#E8EEF5">
    <circle cx="90" cy="400" r="4" fill="#2DD4BF"/>
    <text x="105" y="406">Personalized learning paths for every student</text>
    <circle cx="90" cy="432" r="4" fill="#2DD4BF"/>
    <text x="105" y="438">Instant feedback and 24/7 AI tutoring support</text>
    <circle cx="90" cy="464" r="4" fill="#2DD4BF"/>
    <text x="105" y="470">Reduced grading and admin workload for teachers</text>
    <circle cx="90" cy="496" r="4" fill="#2DD4BF"/>
    <text x="105" y="502">Greater access for students with disabilities or language gaps</text>
    <circle cx="90" cy="528" r="4" fill="#2DD4BF"/>
    <text x="105" y="534">Predictive analytics to catch struggling students early</text>
  </g>

  <!-- Challenges card -->
  <rect x="50" y="570" width="750" height="230" rx="14" fill="#0F1C30" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="80" y="615" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FBBF24">Challenges</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#E8EEF5">
    <circle cx="90" cy="650" r="4" fill="#FBBF24"/>
    <text x="105" y="656">Academic integrity &amp; plagiarism concerns</text>
    <circle cx="90" cy="682" r="4" fill="#FBBF24"/>
    <text x="105" y="688">Data privacy and security of student information</text>
    <circle cx="90" cy="714" r="4" fill="#FBBF24"/>
    <text x="105" y="720">Algorithmic bias affecting fairness of outcomes</text>
    <circle cx="90" cy="746" r="4" fill="#FBBF24"/>
    <text x="105" y="752">Digital divide between well-funded and under-resourced schools</text>
    <circle cx="90" cy="778" r="4" fill="#FBBF24"/>
    <text x="105" y="784">Risk of weakened critical thinking from over-reliance</text>
  </g>

  <!-- Future scope card -->
  <rect x="50" y="820" width="750" height="230" rx="14" fill="#0F1C30" stroke="#8B5FBF" stroke-width="1.5"/>
  <text x="80" y="865" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#B294E8">Future Scope</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#E8EEF5">
    <circle cx="90" cy="900" r="4" fill="#B294E8"/>
    <text x="105" y="906">Sensor-driven smart classrooms that adapt in real time</text>
    <circle cx="90" cy="932" r="4" fill="#B294E8"/>
    <text x="105" y="938">Conversational AI tutors guiding full personalized curricula</text>
    <circle cx="90" cy="964" r="4" fill="#B294E8"/>
    <text x="105" y="970">Skill-based, lifelong learning credentials</text>
    <circle cx="90" cy="996" r="4" fill="#B294E8"/>
    <text x="105" y="1002">AI-augmented universities blending physical and virtual campuses</text>
    <circle cx="90" cy="1028" r="4" fill="#B294E8"/>
    <text x="105" y="1034">Stronger governance and equity-first AI policy frameworks</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="1120" width="850" height="80" fill="#0B1220"/>
  <text x="425" y="1168" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#8FA1B8">Smart Education Assignment · AI for Smart Education · 2026</text>
</svg>
